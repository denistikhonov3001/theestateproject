name: site-quality

on:
  push:
    branches: [main]
    paths-ignore:
      - sitemap.xml
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate sitemap
        run: python qa/generate_sitemap.py

      - name: Static site audit
        run: python qa/site_audit.py

      - name: JavaScript syntax
        run: |
          node --check translations-v86.js
          node --check site-v86.js
          node --check info-v86.js

      - name: Require committed sitemap on pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- sitemap.xml

      - name: Commit refreshed sitemap
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          if ! git diff --quiet -- sitemap.xml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "chore: refresh sitemap [skip ci]"
            git push
          fi
